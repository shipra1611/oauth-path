<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>UPI Spend Insight — Know your money</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #f7f7f5; color: #1a1a1a; min-height: 100vh; }

  /* NAV */
  nav { background: #fff; border-bottom: 1px solid #e8e8e4;
        padding: 0 2rem; height: 56px; display: flex; align-items: center;
        justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .nav-logo { font-size: 16px; font-weight: 600; color: #1a1a1a; }
  .nav-logo span { color: #2563eb; }
  .nav-badge { font-size: 11px; background: #eff6ff; color: #2563eb;
               padding: 3px 10px; border-radius: 99px; border: 1px solid #bfdbfe; }

  /* LANDING */
  .hero { max-width: 640px; margin: 0 auto; padding: 80px 2rem 60px; text-align: center; }
  .hero h1 { font-size: 40px; font-weight: 700; line-height: 1.15; margin-bottom: 16px; }
  .hero h1 em { color: #2563eb; font-style: normal; }
  .hero p  { font-size: 17px; color: #555; line-height: 1.6; margin-bottom: 32px; }
  .hero-steps { display: flex; gap: 12px; justify-content: center;
                flex-wrap: wrap; margin-bottom: 40px; }
  .step-pill { font-size: 13px; background: #fff; border: 1px solid #e8e8e4;
               border-radius: 99px; padding: 6px 14px; color: #444; }
  .step-pill strong { color: #2563eb; }

  /* UPLOAD ZONE */
  .upload-zone { border: 2px dashed #c7d2fe; border-radius: 16px;
                 background: #fff; padding: 48px 32px; text-align: center;
                 cursor: pointer; transition: all .2s; max-width: 480px; margin: 0 auto; }
  .upload-zone:hover, .upload-zone.drag { border-color: #2563eb; background: #eff6ff; }
  .upload-icon { font-size: 40px; margin-bottom: 12px; }
  .upload-zone h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .upload-zone p  { font-size: 13px; color: #777; margin-bottom: 20px; }
  .upload-btn { background: #2563eb; color: #fff; border: none; border-radius: 8px;
                padding: 10px 24px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .upload-btn:hover { background: #1d4ed8; }
  input[type=file] { display: none; }

  /* LOADING */
  .loading { text-align: center; padding: 60px 2rem; }
  .spinner { width: 40px; height: 40px; border: 3px solid #e8e8e4;
             border-top-color: #2563eb; border-radius: 50%;
             animation: spin .8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { color: #555; font-size: 15px; }

  /* DASHBOARD */
  .dashboard { max-width: 860px; margin: 0 auto; padding: 2rem; }
  .dash-header { display: flex; align-items: center; justify-content: space-between;
                 margin-bottom: 1.5rem; flex-wrap: wrap; gap: 12px; }
  .dash-header h2 { font-size: 22px; font-weight: 700; }
  .reset-btn { font-size: 13px; color: #777; background: #fff; border: 1px solid #e8e8e4;
               border-radius: 8px; padding: 6px 14px; cursor: pointer; }
  .reset-btn:hover { background: #f7f7f5; }

  /* METRIC CARDS */
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
             gap: 12px; margin-bottom: 1.5rem; }
  .metric-card { background: #fff; border: 1px solid #e8e8e4; border-radius: 12px;
                 padding: 1rem; }
  .metric-card .label { font-size: 12px; color: #777; margin-bottom: 4px; }
  .metric-card .value { font-size: 22px; font-weight: 700; color: #1a1a1a; }
  .metric-card .sub   { font-size: 12px; color: #999; margin-top: 2px; }

  /* PANELS */
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 1.5rem; }
  @media (max-width: 620px) { .panels { grid-template-columns: 1fr; } }
  .panel { background: #fff; border: 1px solid #e8e8e4; border-radius: 12px; padding: 1.2rem; }
  .panel h3 { font-size: 14px; font-weight: 600; margin-bottom: 1rem; color: #333; }
  .chart-wrap { position: relative; height: 220px; }

  /* CATEGORY LIST */
  .cat-row { display: flex; align-items: center; justify-content: space-between;
             padding: 6px 0; border-top: 1px solid #f0f0ec; font-size: 13px; }
  .cat-row:first-child { border-top: none; }
  .cat-name  { color: #444; }
  .cat-amount { font-weight: 600; color: #1a1a1a; }
  .cat-bar-wrap { flex: 1; margin: 0 10px; height: 4px; background: #f0f0ec; border-radius: 2px; }
  .cat-bar { height: 4px; background: #2563eb; border-radius: 2px; }

  /* SUBSCRIPTIONS */
  .sub-row { display: flex; justify-content: space-between; align-items: center;
             padding: 6px 0; border-top: 1px solid #f0f0ec; font-size: 13px; }
  .sub-row:first-child { border-top: none; }
  .sub-name   { color: #444; max-width: 200px; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  .sub-amount { font-weight: 600; color: #dc2626; }
  .sub-alert  { font-size: 11px; background: #fef2f2; color: #dc2626;
                padding: 2px 8px; border-radius: 99px; margin-left: 8px; }

  /* SHARE CARD */
  .share-card { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 12px;
                padding: 1rem 1.2rem; margin-bottom: 1.5rem;
                display: flex; align-items: center; justify-content: space-between;
                flex-wrap: wrap; gap: 10px; }
  .share-card p { font-size: 13px; color: #1e40af; }
  .share-btn { background: #2563eb; color: #fff; border: none; border-radius: 8px;
               padding: 8px 16px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .share-btn:hover { background: #1d4ed8; }

  /* CHAT */
  .chat-panel { background: #fff; border: 1px solid #e8e8e4; border-radius: 12px;
                padding: 1.2rem; margin-bottom: 1.5rem; }
  .chat-panel h3 { font-size: 14px; font-weight: 600; margin-bottom: 1rem; }
  .chat-messages { min-height: 80px; max-height: 240px; overflow-y: auto;
                   margin-bottom: 12px; }
  .msg { font-size: 13px; line-height: 1.6; padding: 8px 12px;
         border-radius: 8px; margin-bottom: 8px; max-width: 90%; }
  .msg.user { background: #eff6ff; color: #1e40af; margin-left: auto; text-align: right; }
  .msg.ai   { background: #f7f7f5; color: #333; }
  .chat-row { display: flex; gap: 8px; }
  .chat-input { flex: 1; border: 1px solid #e8e8e4; border-radius: 8px;
                padding: 9px 12px; font-size: 13px; outline: none; }
  .chat-input:focus { border-color: #2563eb; }
  .chat-send { background: #2563eb; color: #fff; border: none; border-radius: 8px;
               padding: 9px 16px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .chat-send:disabled { background: #93c5fd; cursor: not-allowed; }
  .quick-q { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .quick-q button { font-size: 12px; background: #f7f7f5; border: 1px solid #e8e8e4;
                    border-radius: 99px; padding: 4px 12px; cursor: pointer; color: #555; }
  .quick-q button:hover { background: #eff6ff; border-color: #bfdbfe; color: #2563eb; }

  /* TOAST */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
           background: #1a1a1a; color: #fff; padding: 10px 20px; border-radius: 8px;
           font-size: 13px; z-index: 999; animation: fadeup .3s ease; }
  @keyframes fadeup { from { opacity:0; transform: translateX(-50%) translateY(8px); }
                      to   { opacity:1; transform: translateX(-50%) translateY(0); } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

const API = "http://localhost:8000";   // change to your deployed URL

const COLORS = ["#2563eb","#10b981","#f59e0b","#ef4444","#8b5cf6",
                 "#06b6d4","#f97316","#84cc16","#ec4899","#6366f1","#14b8a6"];

const QUICK_QUESTIONS = [
  "Where am I spending the most?",
  "Which subscriptions can I cancel?",
  "How does my food spend compare to transport?",
  "What's my biggest unnecessary expense?",
];

// ── Landing ──────────────────────────────────────────────────
function Landing({ onUpload, loading }) {
  const [drag, setDrag] = useState(false);
  const inputRef = useRef();

  const handleFile = (file) => {
    if (file && file.name.endsWith(".csv")) onUpload(file);
  };

  return (
    <div className="hero">
      <h1>Understand your<br/><em>UPI spending</em><br/>in 60 seconds</h1>
      <p>Upload your PhonePe, GPay or bank CSV.<br/>
         Our AI categorises every transaction instantly.</p>
      <div className="hero-steps">
        <span className="step-pill"><strong>1.</strong> Upload CSV</span>
        <span className="step-pill"><strong>2.</strong> AI categorises</span>
        <span className="step-pill"><strong>3.</strong> See insights</span>
        <span className="step-pill"><strong>4.</strong> Chat with your data</span>
      </div>

      {loading ? (
        <div className="loading">
          <div className="spinner"/>
          <p>Analysing your transactions…</p>
        </div>
      ) : (
        <div
          className={`upload-zone ${drag ? "drag" : ""}`}
          onDragOver={e => { e.preventDefault(); setDrag(true); }}
          onDragLeave={() => setDrag(false)}
          onDrop={e => { e.preventDefault(); setDrag(false); handleFile(e.dataTransfer.files[0]); }}
          onClick={() => inputRef.current.click()}
        >
          <div className="upload-icon">📂</div>
          <h3>Drop your transaction CSV here</h3>
          <p>PhonePe · GPay · Paytm · Any bank statement<br/>
             Your data never leaves your browser session.</p>
          <button className="upload-btn">Choose file</button>
          <input ref={inputRef} type="file" accept=".csv"
                 onChange={e => handleFile(e.target.files[0])} />
        </div>
      )}
    </div>
  );
}

// ── Donut Chart ───────────────────────────────────────────────
function DonutChart({ data }) {
  const canvasRef = useRef();
  useEffect(() => {
    const labels = Object.keys(data);
    const values = Object.values(data);
    const chart = new Chart(canvasRef.current, {
      type: "doughnut",
      data: {
        labels,
        datasets: [{ data: values, backgroundColor: COLORS.slice(0, labels.length),
                     borderWidth: 2, borderColor: "#fff" }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
                   tooltip: { callbacks: {
                     label: ctx => ` ₹${ctx.parsed.toLocaleString("en-IN")}`
                   }}}
      }
    });
    return () => chart.destroy();
  }, [data]);
  return <div className="chart-wrap"><canvas ref={canvasRef}/></div>;
}

// ── Dashboard ─────────────────────────────────────────────────
function Dashboard({ result, onReset }) {
  const { summary, transactions } = result;
  const [messages, setMessages] = useState([]);
  const [question, setQuestion] = useState("");
  const [chatLoading, setChatLoading] = useState(false);
  const [toast, setToast] = useState(null);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2500);
  };

  const totalSpend   = summary.total_spend;
  const byCategory   = summary.by_category;
  const maxCat       = Math.max(...Object.values(byCategory));
  const subs         = summary.subscriptions || [];
  const subsTotal    = subs.reduce((s, r) => s + r.amount, 0);
  const topCats      = Object.entries(byCategory)
                         .sort((a,b) => b[1] - a[1]).slice(0, 6);

  const sendChat = async (q) => {
    const qText = q || question;
    if (!qText.trim()) return;
    setMessages(m => [...m, { role: "user", text: qText }]);
    setQuestion("");
    setChatLoading(true);
    try {
      const res = await fetch(`${API}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: qText, summary, transactions })
      });
      const data = await res.json();
      setMessages(m => [...m, { role: "ai", text: data.answer }]);
    } catch {
      setMessages(m => [...m, { role: "ai", text: "Could not reach the server. Is the backend running?" }]);
    }
    setChatLoading(false);
  };

  const shareReport = () => {
    const top = topCats[0];
    const text = `I analysed my UPI transactions — spent ₹${totalSpend.toLocaleString("en-IN")} total. Biggest category: ${top[0]} at ₹${top[1].toLocaleString("en-IN")}. Check yours at upi-insight.app`;
    navigator.clipboard.writeText(text).then(() => showToast("Share text copied!"));
  };

  return (
    <div className="dashboard">
      <div className="dash-header">
        <h2>Your spend breakdown</h2>
        <button className="reset-btn" onClick={onReset}>Upload new file</button>
      </div>

      {/* Metrics */}
      <div className="metrics">
        <div className="metric-card">
          <div className="label">Total spend</div>
          <div className="value">₹{Math.round(totalSpend).toLocaleString("en-IN")}</div>
          <div className="sub">{summary.txn_count} transactions</div>
        </div>
        <div className="metric-card">
          <div className="label">Categories</div>
          <div className="value">{Object.keys(byCategory).length}</div>
          <div className="sub">detected by AI</div>
        </div>
        <div className="metric-card">
          <div className="label">Subscription burn</div>
          <div className="value" style={{color:"#dc2626"}}>
            ₹{Math.round(subsTotal).toLocaleString("en-IN")}
          </div>
          <div className="sub">{subs.length} subscriptions found</div>
        </div>
        <div className="metric-card">
          <div className="label">Top category</div>
          <div className="value" style={{fontSize:"16px", paddingTop:"4px"}}>
            {topCats[0]?.[0] || "—"}
          </div>
          <div className="sub">₹{Math.round(topCats[0]?.[1]||0).toLocaleString("en-IN")}</div>
        </div>
      </div>

      {/* Share card */}
      <div className="share-card">
        <p>Share your spend report with friends — it's the referral hook 🚀</p>
        <button className="share-btn" onClick={shareReport}>Copy share text</button>
      </div>

      {/* Charts */}
      <div className="panels">
        <div className="panel">
          <h3>Spend by category</h3>
          <DonutChart data={byCategory}/>
        </div>
        <div className="panel">
          <h3>Category breakdown</h3>
          {topCats.map(([cat, amt]) => (
            <div className="cat-row" key={cat}>
              <span className="cat-name">{cat}</span>
              <div className="cat-bar-wrap">
                <div className="cat-bar" style={{width: `${Math.round((amt/maxCat)*100)}%`}}/>
              </div>
              <span className="cat-amount">₹{Math.round(amt).toLocaleString("en-IN")}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Subscriptions */}
      {subs.length > 0 && (
        <div className="panel" style={{marginBottom:"16px"}}>
          <h3>Subscriptions detected <span className="sub-alert">review these</span></h3>
          {subs.slice(0,8).map((s, i) => (
            <div className="sub-row" key={i}>
              <span className="sub-name">{s.description}</span>
              <span className="sub-amount">₹{Math.round(s.amount).toLocaleString("en-IN")}</span>
            </div>
          ))}
        </div>
      )}

      {/* Chat */}
      <div className="chat-panel">
        <h3>Ask your data anything</h3>
        <div className="quick-q">
          {QUICK_QUESTIONS.map(q => (
            <button key={q} onClick={() => sendChat(q)}>{q}</button>
          ))}
        </div>
        <div className="chat-messages">
          {messages.map((m, i) => (
            <div key={i} className={`msg ${m.role}`}>{m.text}</div>
          ))}
          {chatLoading && <div className="msg ai">Thinking…</div>}
        </div>
        <div className="chat-row">
          <input className="chat-input" value={question}
                 placeholder="e.g. How much did I spend on food?"
                 onChange={e => setQuestion(e.target.value)}
                 onKeyDown={e => e.key === "Enter" && sendChat()}/>
          <button className="chat-send" onClick={() => sendChat()} disabled={chatLoading}>
            {chatLoading ? "…" : "Ask"}
          </button>
        </div>
      </div>

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

// ── App root ──────────────────────────────────────────────────
function App() {
  const [result, setResult]   = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError]     = useState(null);

  const handleUpload = async (file) => {
    setLoading(true);
    setError(null);
    const form = new FormData();
    form.append("file", file);
    try {
      const res  = await fetch(`${API}/upload`, { method: "POST", body: form });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Upload failed");
      setResult(data);
    } catch (err) {
      setError(err.message);
    }
    setLoading(false);
  };

  return (
    <>
      <nav>
        <span className="nav-logo">UPI<span>Insight</span></span>
        <span className="nav-badge">AI-powered · Free</span>
      </nav>
      {error && (
        <div style={{background:"#fef2f2",color:"#dc2626",padding:"12px 2rem",
                     fontSize:"13px",textAlign:"center"}}>
          {error} — <button style={{color:"#dc2626",background:"none",border:"none",
                                    cursor:"pointer",textDecoration:"underline"}}
                            onClick={() => setError(null)}>Try again</button>
        </div>
      )}
      {result
        ? <Dashboard result={result} onReset={() => setResult(null)}/>
        : <Landing onUpload={handleUpload} loading={loading}/>
      }
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
